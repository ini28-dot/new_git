<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101d">
  <title>About — A Little Moment of Magic</title>
  <style>
    :root { color-scheme: dark; --ink: #f8f7ff; --muted: #b6b4ca; --line: rgba(255,255,255,.16); }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem 1rem; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10101d; background-image: radial-gradient(ellipse at 18% 18%, rgba(119,92,255,.36), transparent 34%), radial-gradient(ellipse at 82% 78%, rgba(255,111,166,.25), transparent 32%), radial-gradient(ellipse at 70% 12%, rgba(63,203,227,.16), transparent 28%); }
    .scene { width: min(100%, 760px); }
    .card { padding: clamp(2rem, 7vw, 4.5rem); text-align: center; border: 1px solid var(--line); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035)); box-shadow: 0 32px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(22px); }
    .eyebrow { display: inline-flex; gap: .55rem; padding: .55rem .9rem; border: 1px solid var(--line); border-radius: 999px; color: #d7d3f4; background: rgba(255,255,255,.045); font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow::before { content: "✦"; color: #ffce78; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); line-height: .98; letter-spacing: -.07em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #a99aff 8%, #f5a8d6 53%, #ffd28b 92%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 38rem; margin: 0 auto; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.8; }
    .rule { width: 54px; height: 2px; margin: 2rem auto; border-radius: 5px; background: linear-gradient(90deg, #a99aff, #ff9fc6); }
    .site-nav { display: flex; justify-content: center; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .site-nav a { color: var(--ink); text-decoration: none; padding: .65rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.05); font-size: .9rem; transition: background .2s ease, transform .2s ease; }
    .site-nav a:hover, .site-nav a:focus-visible { background: rgba(255,255,255,.14); transform: translateY(-2px); }
    .site-nav a:focus-visible { outline: 2px solid #ffd28b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">A little about me</div>
      <h1 id="page-title">Curious by nature,<br><span>making things with heart.</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p>Hi, I’m Inioluwa. This little corner of the web is a place for fresh ideas, creative experiments, and the joy of learning as I go. I’m glad you stopped by—there’s always something new beginning here.</p>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="hello-world.html">Home</a>
        <a href="contact.html">Contact</a>
      </nav>
    </section>
  </main>
</body>
</html>
